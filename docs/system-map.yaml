# docs/system-map.yaml — the Stage Registry (Phase 2 of
# docs/system-observability-design.md's Part 1).
#
# One real entry per real stage across the three subsystems built this
# session (verification-pipeline, problem-space-modeling,
# pattern-learning-architecture), plus the observability mechanism itself
# (system-observability). Every entry was derived by reading its real
# source module or skill-content file directly — never guessed from a
# function or stage name. tests/test_system_map.py enforces the shape.
#
# `grounding`:
#   deterministic — same input, same output, every time, no human/session
#     judgment anywhere inside.
#   llm_judgment  — a real, unforced human/session decision with no
#     mechanical check behind it.
#   hybrid        — a mechanical function whose OUTPUT depends on an
#     upstream judgment call that fed it (the function itself is
#     deterministic; the judgment lives one step upstream).
#
# Going forward: every new ticket's DONE-MEANS includes adding its real
# stage(s) here (see the design doc's "Going forward" section).

- name: claim_intake
  grounding: deterministic
  subsystem: verification-pipeline
  triggers_on: "a Claim is constructed with no explicit stage (Claim dataclass default = Stage.INTAKE)"
  reads: []
  writes: []
  real_log: null
  untraced_reason: "the default construction state is never itself event-logged; only transitions away from it are"

- name: abstract_claim
  grounding: deterministic
  subsystem: verification-pipeline
  triggers_on: "a claim statement needs proprietary terms stripped (glossary + path/ticket-ID + identifier-pattern rules) before anything goes to external research"
  reads: []
  writes: []
  real_log: null
  untraced_reason: "pure function; verification_contract.run_checker's docstring says ABSTRACT is not yet run by that entrypoint, so this stage has no wired event-log path today"

- name: bound
  grounding: deterministic
  subsystem: verification-pipeline
  triggers_on: "advance()/rework() transitions a claim into Stage.BOUND — reserved for domain-enumeration, no real logic behind it yet beyond stage-transition bookkeeping (verification_contract.py's own docstring)"
  reads: []
  writes: [state/verification-pipeline/events.jsonl]
  real_log: state/verification-pipeline/events.jsonl

- name: run_dual_pass_research
  grounding: hybrid
  subsystem: verification-pipeline
  triggers_on: "Stage.RESEARCH — an abstracted question needs two independent research passes before DIFF"
  reads: []
  writes: []
  real_log: null
  untraced_reason: "run_dual_pass_research's fan-out (pass_a(question), pass_b(question)) is mechanical and deterministic every time, but the FactSet it produces is entirely a function of whatever real research passes are injected — in real use those are LLM-driven research, so the stage's actual output rides on an upstream judgment call it has zero mechanical check over. Classified hybrid, not deterministic, for that reason."

- name: diff_fact_sets
  grounding: deterministic
  subsystem: verification-pipeline
  triggers_on: "Stage.DIFF — two independently-produced FactSets from RESEARCH need comparing, topic by topic"
  reads: []
  writes: []
  real_log: null
  untraced_reason: "diff_stage_outcome (the function that drives the real advance()/rework() transition off this result) is called with no `root` argument anywhere in this codebase, so neither the DIFF->DECOMPOSE advance nor the DIFF->RESEARCH rework it triggers is captured in events.jsonl today — a real, specific gap this registry surfaces rather than papering over"

- name: generate_sub_claims
  grounding: deterministic
  subsystem: verification-pipeline
  triggers_on: "Stage.DECOMPOSE — a scanner graph (mechanism x host pairs) needs breaking into sub_claims; run_checker sets claim.stage = Stage.DECOMPOSE directly, bypassing advance(), so entry into this stage is itself not event-logged"
  reads: [state/verification-pattern-library.jsonl]
  writes: []
  real_log: state/verification-contracts/claims/

- name: verify
  grounding: deterministic
  subsystem: verification-pipeline
  triggers_on: "Stage.VERIFY — every sub_claim's status is checked against 'verified' (Claim.all_verified / gate_claim_done's unresolved check) before PATTERN_CAPTURE/GATE"
  reads: [state/verification-contracts/claims/]
  writes: []
  real_log: state/verification-pipeline/events.jsonl

- name: append_pattern_library_entries
  grounding: deterministic
  subsystem: verification-pipeline
  triggers_on: "Stage.PATTERN_CAPTURE — a claim's newly-found failed/unverified sub_claims need recording in the pattern library after VERIFY"
  reads: [state/verification-pattern-library.jsonl]
  writes: [state/verification-pattern-library.jsonl]
  real_log: state/verification-pattern-library.jsonl

- name: retrieve_similar_patterns
  grounding: deterministic
  subsystem: verification-pipeline
  triggers_on: "Stage.RETRIEVE (reserved, no forward wiring in FORWARD_EDGES yet) — generate_sub_claims called with claim_statement+root runs a stdlib difflib pass over the pattern library for a pattern_hint"
  reads: [state/verification-pattern-library.jsonl]
  writes: []
  real_log: null
  untraced_reason: "read-only retrieval; nothing persisted by this function itself"

- name: gate_claim_done
  grounding: deterministic
  subsystem: verification-pipeline
  triggers_on: "Stage.GATE — one claim is checked for unresolved sub_claims before it may be reported done"
  reads: [state/verification-contracts/claims/]
  writes: []
  real_log: null
  untraced_reason: "returns an in-memory deny dict; the claims it reads are the only durable record"

- name: gate_all_claims
  grounding: deterministic
  subsystem: verification-pipeline
  triggers_on: "the real PreToolUse boundary for session_end(close_cluster=True) — aggregates gate_claim_done across every claim on record under YOUK_ROOT"
  reads: [state/verification-contracts/claims/]
  writes: []
  real_log: null
  untraced_reason: "returns an in-memory deny at the PreToolUse boundary; the claims it reads are the durable record (S12 adds a gate event here)"

- name: run_checker
  grounding: deterministic
  subsystem: verification-pipeline
  triggers_on: "the single real entrypoint for building, persisting, and gating a claim against a scanner graph in one pass (CLI or direct call)"
  reads: [state/verification-contracts/host-inventory-graph.json]
  writes: [state/verification-contracts/claims/, state/verification-pattern-library.jsonl, state/verification-pipeline/events.jsonl]
  real_log: state/verification-pipeline/events.jsonl

- name: run_rework_loop
  grounding: deterministic
  subsystem: verification-pipeline
  triggers_on: "VERIFY needs re-running repeatedly (re-scanning via graph_fn each round) until a round surfaces zero NEW findings, capped at MAX_REWORK_ROUNDS=5"
  reads: []
  writes: [state/verification-contracts/claims/, state/verification-pattern-library.jsonl, state/verification-pipeline/events.jsonl]
  real_log: state/verification-pipeline/events.jsonl

- name: build_domain_brief
  grounding: deterministic
  subsystem: problem-space-modeling
  triggers_on: "a project's Domain Brief needs (re)building from its real decision records — called directly (domain_brief.py's __main__), or by reversal_check.detect_reversals"
  reads: [DECISIONS.md, knowledge/projects/youk/decisions.md]
  writes: [state/domain-brief.json]
  real_log: state/domain-brief.json

- name: find_domain_edge_case_candidates
  grounding: deterministic
  subsystem: problem-space-modeling
  triggers_on: "nfr-check Phase 1 (CLASSIFY-adjacent), M/L/XL task — task text keyword-matched against a project's real Domain Brief vocabulary"
  reads: [state/domain-brief.json]
  writes: []
  real_log: null
  untraced_reason: "pure read + score; the disposition each candidate earns is logged separately by append_disposition_event"

- name: domain_edge_case_disposition_judgment
  grounding: llm_judgment
  subsystem: problem-space-modeling
  triggers_on: "nfr-check Phase 1, for each non-empty domain_edge_case_candidates entry — judged against the task text and assigned accepted/dismissed/ignored"
  reads: []
  writes: []
  real_log: null
  untraced_reason: "the judgment itself is session output ([no fixed block name] — logged via the separate append_disposition_event call, not persisted directly by this step"

- name: domain_brief_fallback
  grounding: llm_judgment
  subsystem: problem-space-modeling
  triggers_on: "nfr-check Phase 1, domain_edge_case_candidates is empty AND state/domain-brief.json is missing or every source shows format_recognized false/null — codebase examined directly to infer 2-4 bounded contexts"
  reads: [state/domain-brief.json]
  writes: []
  real_log: null
  untraced_reason: "deliberately never written back to state/domain-brief.json — a session-local, lower-confidence hypothesis by design (skills/nfr-check/SKILL.md's own instruction)"

- name: reframe_and_package_review
  grounding: deterministic
  subsystem: problem-space-modeling
  triggers_on: "every nfr_check result with domain edge-case candidates: nfr._domain_edge_case_fields reframes them (reframe_candidates) and attaches a self-contained review request (build_independent_review_request) for a fresh session or subagent where the host has one"
  reads: []
  writes: []
  real_log: null
  untraced_reason: "pure in-memory transform/packaging; whether the host dispatches it to a separate session is the host's choice"

- name: domain_scope_naming
  grounding: llm_judgment
  subsystem: problem-space-modeling
  triggers_on: "nfr-check CLASSIFY phase, M+ task — 2-4 knowledge domains beyond generic software engineering named fresh for this task, never cached from a prior answer"
  reads: []
  writes: []
  real_log: null
  untraced_reason: "the [DOMAIN SCOPE] block is session output; the durable record is written by the separate append_domain_scope_event call"

- name: build_domain_research_invocation
  grounding: deterministic
  subsystem: problem-space-modeling
  triggers_on: "immediately after domain_scope_naming logs 2-4 domains for this task — constructs the scoped /research invocation for youk-research's existing WebSearch -> extract -> propose loop"
  reads: []
  writes: []
  real_log: null
  emits: [tool]  # constructs an invocation string only; the research run itself produces no dedicated log file this function writes to

- name: challenge_lens3_external_evidence
  grounding: llm_judgment
  subsystem: problem-space-modeling
  triggers_on: "challenge Lens 3 (hidden assumptions), when nfr_check already named domain scope and ran domain research for this task — reads what that research found before asserting a hidden-assumption objection from internal reasoning alone"
  reads: []
  writes: []
  real_log: null
  untraced_reason: "a no-op when no domain research ran for this task (S-task, or nfr_check hasn't fired); when it does run, the citation lands in the challenge's own output, not a separate persisted file"

- name: append_domain_scope_event
  grounding: deterministic
  subsystem: system-observability
  triggers_on: "youk-core.log_domain_scope_event(task, domains) called immediately after domain_scope_naming names domains for this task"
  reads: [schemas/domain-scope-event.schema.json]
  writes: [state/domain-scope-log.jsonl]
  real_log: state/domain-scope-log.jsonl

- name: append_disposition_event
  grounding: deterministic
  subsystem: pattern-learning-architecture
  triggers_on: "youk-core.log_domain_edge_case_disposition(...) called right after domain_edge_case_disposition_judgment decides a candidate's disposition"
  reads: [schemas/disposition-event.schema.json]
  writes: [state/disposition-log.jsonl]
  real_log: state/disposition-log.jsonl

# detect_reversals/confirm_reversed_pattern/find_promotion_candidates/
# promote_group are reachable as youk-core tools (detect_domain_reversals,
# confirm_domain_reversal, find_pattern_promotion_candidates, promote_pattern_group)
# and self-heal steps 5-6. They were unwired once for duplicating
# _detect_cross_project_patterns -> promote_to_global_contracts; promote_pattern_group
# now refuses a meaning-duplicate. Keep them only if they produce entries on real data.
- name: detect_reversals
  grounding: deterministic
  subsystem: pattern-learning-architecture
  triggers_on: "self-heal Phase 1 step 5, via the youk-core.detect_domain_reversals tool, when state/domain-brief.json exists"
  reads: [DECISIONS.md, knowledge/projects/youk/decisions.md, state/domain-brief-known-sources/, state/disposition-log.jsonl]
  writes: [state/domain-brief-known-sources/]
  real_log: null
  emits: [tool]

- name: reversal_domain_naming_judgment
  grounding: llm_judgment
  subsystem: pattern-learning-architecture
  triggers_on: "self-heal Phase 1 step 5, for each pair detect_domain_reversals returns, before confirm_domain_reversal"
  reads: []
  writes: []
  real_log: null
  untraced_reason: "session output; the pair it names is recorded by confirm_domain_reversal once confirmed"

- name: confirm_reversed_pattern
  grounding: hybrid
  subsystem: pattern-learning-architecture
  triggers_on: "youk-core.confirm_domain_reversal tool, after the reversal-confirmation judgment block"
  reads: []
  writes: [state/confirmed-patterns.jsonl]
  real_log: state/confirmed-patterns.jsonl

- name: find_promotion_candidates
  grounding: deterministic
  subsystem: pattern-learning-architecture
  triggers_on: "self-heal Phase 1 step 6, via the youk-core.find_pattern_promotion_candidates tool"
  reads: [state/confirmed-patterns.jsonl]
  writes: []
  real_log: null
  emits: [tool]

- name: promotion_statement_selection_judgment
  grounding: llm_judgment
  subsystem: pattern-learning-architecture
  triggers_on: "self-heal Phase 1 step 6, for a group with more than one distinct abstracted wording, before promote_pattern_group"
  reads: []
  writes: []
  real_log: null
  untraced_reason: "session output; the chosen wording is recorded by promote_pattern_group in state/global-patterns.jsonl"

- name: promote_group
  grounding: hybrid
  subsystem: pattern-learning-architecture
  triggers_on: "youk-core.promote_pattern_group tool, after the wording is chosen"
  reads: []
  writes: [state/global-patterns.jsonl]
  real_log: state/global-patterns.jsonl

- name: promote_to_global_contracts
  grounding: hybrid
  subsystem: pattern-learning-architecture
  triggers_on: "_detect_cross_project_patterns finds a contract recurring across >=2 real projects; caller names domain/sub_domain and calls this to write it as a tagged PatternEntry"
  reads: [state/global-patterns.jsonl]
  writes: [state/global-patterns.jsonl, knowledge/global/contracts.md]
  real_log: state/global-patterns.jsonl

- name: query_global_patterns
  grounding: deterministic
  subsystem: pattern-learning-architecture
  triggers_on: "a caller needs promoted cross-project patterns, optionally filtered by domain and/or sub_domain"
  reads: [state/global-patterns.jsonl]
  writes: []
  real_log: null
  untraced_reason: "read-only query; nothing persisted"

- name: check_proposal_backlog_gate
  grounding: deterministic
  subsystem: system-observability
  triggers_on: "self_heal() -- deterministically checks whether the real pending-proposal count meets proposal-review's own SKILL.md trigger threshold (>=3), instead of relying on a model noticing the count"
  reads: []
  writes: []
  real_log: null
  emits: [gate]  # read-only check; its result is returned inline from self_heal, not separately logged

- name: optimize_intent_size_estimate
  grounding: llm_judgment
  subsystem: intent-sizing
  triggers_on: "optimize_intent full path (no fast-pattern match, provider available) -- the model estimates task size and scope"
  reads: [state/sizing-decisions.jsonl, state/domain-brief.json]
  writes: []
  real_log: state/sizing-decisions.jsonl  # grounding_status / precedent_count / domain_invariant_count record what evidence the estimate was shown, including "unavailable" when it was made cold

- name: route_task_size_resolution
  grounding: deterministic
  subsystem: intent-sizing
  triggers_on: "every route_task call -- keyword-scores the task and takes the larger of that and the model's estimate"
  reads: []
  writes: [state/sizing-decisions.jsonl]
  real_log: state/sizing-decisions.jsonl

- name: retire_global_pattern
  grounding: deterministic
  subsystem: pattern-learning-architecture
  triggers_on: "youk-core.retire_global_pattern tool, called when a promoted learning is contradicted by a later confirmed decision or by a promote_to_global_contracts conflict"
  reads: [state/global-patterns.jsonl]
  writes: [state/global-patterns.jsonl]
  real_log: state/global-patterns.jsonl  # append-only: a retired copy with status "retired" and a reason supersedes the live row

- name: event_ledger_emit
  grounding: deterministic
  subsystem: value-instrumentation
  triggers_on: "any hook or server code calling events.emit (wired by the hook taps and server spans, docs/value-plan cards S03 and S04); rejects anything that is not an enum, identifier, number or hashed id"
  reads: []
  writes: [state/events/]
  real_log: null
  emits: [tool, skill, gate, hook, correction, test, commit, outcome, session]  # sharded per project and month under state/events/{slug}/{YYYY-MM}.jsonl, not one file; the value report (S05) is its reader

- name: usage_tap_events
  grounding: deterministic
  subsystem: value-instrumentation
  triggers_on: "PostToolUse, PostToolUseFailure and SessionEnd hooks (plugin/scripts/usage_tap.py): records tool, skill, test-runner, commit and session-end events from the host payload, classified by regex, never the command text"
  reads: [plugin/scripts/usage_tap.py]
  writes: [state/events/]
  real_log: null
  emits: [tool, skill, test, commit, session, hook]  # sharded per project and month under state/events/; the value report (S05) is its reader

- name: correction_event_capture
  grounding: deterministic
  subsystem: value-instrumentation
  triggers_on: "UserPromptSubmit hook: a prompt matching the pushback phrase list or the stated-rule phrase list (servers/shared/phrases.py) is counted as a correction event, name only, never the prompt text"
  reads: [servers/shared/phrases.py]
  writes: [state/events/]
  real_log: null
  emits: [correction]  # same sharded ledger as usage_tap_events

- name: server_tool_spans
  grounding: deterministic
  subsystem: value-instrumentation
  triggers_on: "every MCP tool call on youk-core and youk-code (install_tool_spans wraps each @mcp.tool at registration): records the tool's own latency and ok, fail or block status, plus gate, task_done, route, checkpoint and session_end events"
  reads: [servers/shared/tool_spans.py]
  writes: [state/events/]
  real_log: null
  emits: [tool, gate, outcome]  # same sharded ledger as usage_tap_events; events carry src=server, hook events carry src=hook

- name: pre_tool_use_gates
  grounding: deterministic
  subsystem: host-hooks
  triggers_on: "PreToolUse hook (plugin/scripts/pre_tool_use.py): denies M+ writes without routing, destructive commands, calls to a stale server, and session_end with unresolved claims"
  reads: [plugin/scripts/pre_tool_use.py]
  writes: []
  real_log: null
  untraced_reason: "a denial is returned to the host and is not yet recorded as an event; S12 adds a gate event at this boundary"

- name: post_tool_use_active_task
  grounding: deterministic
  subsystem: host-hooks
  triggers_on: "PostToolUse hook (plugin/scripts/post_tool_use.py) after Bash, Read, Write and Edit: keeps state/active_task.json current"
  reads: [plugin/scripts/post_tool_use.py]
  writes: []
  real_log: null
  untraced_reason: "overwrites one state file; usage of the same calls is recorded by usage_tap.py"

- name: pre_compact_brief
  grounding: deterministic
  subsystem: host-hooks
  triggers_on: "PreCompact hook (plugin/scripts/pre_compact.py): injects contracts, the active task and the plan before the host compacts"
  reads: [plugin/scripts/pre_compact.py]
  writes: []
  real_log: null
  untraced_reason: "output goes to the host and leaves no record; a compaction event is a candidate once the value report needs it"

- name: session_start_brief
  grounding: deterministic
  subsystem: host-hooks
  triggers_on: "SessionStart hook (plugin/scripts/session_start.py): delivers the session brief to the model and records the session start"
  reads: [plugin/scripts/session_start.py]
  writes: [state/events/]
  real_log: null
  emits: [session]

- name: user_prompt_submit_brief
  grounding: deterministic
  subsystem: host-hooks
  triggers_on: "UserPromptSubmit hook (plugin/scripts/user_prompt_submit.py): counts corrections and injects the intent-gated brief"
  reads: [plugin/scripts/user_prompt_submit.py]
  writes: [state/events/]
  real_log: null
  emits: [correction]
