# Concept coherence graph — each concept has exactly one authority file.
# Derived files implement the concept; they must not redefine it.
# check_doc_graph() and session_start._check_doc_freshness() use this
# to surface drift within one session of the authority file changing.
concepts:
  - concept: north_star
    description: "What youk is fundamentally for — compounds user ability, not just tool context"
    authority: PHILOSOPHY.md
    invariant: "compounds"
    derived_in:
      - README.md
      - ~/.claude/CLAUDE.md

  - concept: org_score_definition
    description: "org_score formula: 5.0 base + capability_skill_rate (2.0) + close_rate (0.5) + gap_resolution + prevented_cost + framing_accuracy + autonomy_depth + loop_dry_rate + human_precision + convergence/durability bonuses; ceiling 10.0"
    authority: servers/core/src/health.py
    invariant: "capability_skill_rate"
    derived_in:
      - README.md
      - docs/well-architected.md

  - concept: compounding_mechanism
    description: "How sessions compound: capability skills + close_cluster + /learn"
    authority: PHILOSOPHY.md
    invariant: "close_cluster"
    derived_in:
      - README.md
      - ~/.claude/CLAUDE.md

  - concept: guardrail_contract
    description: "Hard vs soft rules — what is enforced at tool level vs surfaced as nudge"
    authority: config/guardrails.yaml
    derived_in:
      - PHILOSOPHY.md
      - docs/well-architected.md

  - concept: api_key_required
    description: "Whether an ANTHROPIC_API_KEY is required to install and run youk"
    authority: scripts/install.sh
    derived_in:
      - README.md
      - docs/getting-started.md
      - docs/scheduling.md
      - CONTRIBUTING.md

  - concept: session_close_contract
    description: "What /done does and which phrases trigger it"
    authority: ~/.claude/CLAUDE.md
    invariant: "/done"
    derived_in:
      - docs/claude-md-template.md
      - docs/getting-started.md
      - skills/done/SKILL.md

  - concept: mcp_registration_command
    description: "Exact MCP server registration command"
    authority: scripts/install.sh
    invariant: "--transport http"
    derived_in:
      - docs/getting-started.md
      - README.md

  - concept: context_hook_architecture
    description: "Three hooks (PreCompact, UserPromptSubmit, PostToolUse) that manage context automatically"
    authority: plugin/hooks/hooks.json
    invariant: "PreCompact"
    derived_in:
      - docs/getting-started.md
      - docs/well-architected.md
      - README.md

  - concept: intent_gated_brief
    description: "build_brief mode=index returns ~100-200 token brief gated on intent keywords"
    authority: servers/core/src/compaction.py
    derived_in:
      - docs/well-architected.md

  - concept: active_task_state
    description: "PostToolUse hook writes state/active_task.json for post-compact resume accuracy"
    authority: plugin/scripts/post_tool_use.py
    invariant: "active_task"
    derived_in:
      - docs/getting-started.md

  - concept: scope_collapse_gate
    description: "optimize_intent models solution fork before asking; ambiguity_detected=true blocks route_task until resolved"
    authority: servers/core/src/intent.py
    invariant: "ambiguity_detected"
    derived_in:
      - ~/.claude/CLAUDE.md
      - skills/dev-loop/SKILL.md

  - concept: nfr_gate
    description: "check_nfr_gate blocks M+ dev-loop until an NFR Decision Block is supplied; XS/S always pass"
    authority: servers/core/src/nfr_gate.py
    invariant: "check_nfr_gate"
    derived_in:
      - ~/.claude/CLAUDE.md
      - skills/dev-loop/SKILL.md

  - concept: health_checkup_suite
    description: "Hierarchical integration test suite (L0–L6): make checkup / checkup-fast / checkup-static. Each layer gates the next. L3 exercises all capability skills via real MCP, L5 tests proposal lifecycle, L6 runs full session round-trip."
    authority: Makefile
    invariant: "checkup-fast"
    derived_in:
      - docs/getting-started.md
      - docs/well-architected.md

  - concept: ceremony_sequencer
    description: "ceremony_sequencer.py tracks gate order per slug; warns if challenge fires before nfr, or dev-loop is skipped"
    authority: servers/shared/ceremony_sequencer.py
    invariant: "ceremony_sequencer"
    derived_in:
      - docs/well-architected.md

  - concept: failure_pattern_detector
    description: "scan_failure_patterns() surfaces recurring failure domains at session_start when a category hits threshold in lookback window"
    authority: servers/core/src/failure_pattern_detector.py
    invariant: "scan_failure_patterns"
    derived_in:
      - docs/well-architected.md

  - concept: skill_reentry
    description: "check_reentry() suggests routing back to an earlier skill phase when write_skill_handoff severity meets edge threshold in skill-graph.yaml"
    authority: servers/shared/skill_reentry.py
    invariant: "reentry_suggestion"
    derived_in:
      - docs/well-architected.md

  - concept: medium_risk_soft_block
    description: "translation_risk=medium produces SoftRuleWarning instead of blocking; mark_medium_risk_surfaced() confirms question was shown"
    authority: servers/core/src/routing.py
    invariant: "medium-translation-risk"
    derived_in:
      - docs/well-architected.md

  - concept: release_version
    description: "Current release version — README status line must match CHANGELOG latest version and git tag"
    authority: CHANGELOG.md
    invariant: "1.1.0"
    derived_in:
      - README.md
