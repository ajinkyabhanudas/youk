prompt: 'Fix cold-start false positives in detect_reversals


  Found by independent verification, not by the test suite -- every real

  test seeded the ledger with a throwaway detect_reversals call before

  logging a dismissal, so none of them exercised a project''s genuine

  first-ever run. Reproduced directly: logging a dismissal before the

  ledger has ever been written caused every pre-existing entry in the

  real brief to count as "new" (trivially true against an empty ledger),

  so the dismissed event''s own unchanged entry matched itself, and a

  second, unrelated entry sharing a single keyword ("langfuse") also

  false-matched. Root cause: "new" has no real meaning without a prior

  baseline to diff against. Fixed by seeding the ledger and reporting

  nothing on a genuinely first-ever run, rather than trying to patch the

  self-match case alone (which was tried first and only closed part of

  the real gap). Added the missing cold-start test.'
