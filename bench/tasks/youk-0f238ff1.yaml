prompt: 'Close two real gaps found by tonight''s audit: silent orphan-cap and leak-free promotion


  wiring_pulse/pipeline_pulse warnings were capped at 5 in ephemeral -start

  text, and since check_wiring''s orphan order is deterministic, the same first 5

  were the only ones ever shown -- anything past slot 5 was never individually

  named, in any , ever. Now the full, uncapped result is appended to a

  durable JSONL log (state/wiring-pulse-log.jsonl, state/pipeline-pulse-log.jsonl)

  every run, so detection isn''t undermined by a soft, easily-ignored follow-through

  step. Also found and fixed along the way: the wiring/pipeline checks lived inside

  _check_doc_freshness, gated behind an early return on docs/doc-map.yaml existing

  -- meaning they silently never ran at all if that unrelated file was missing,

  despite ''s own docstring claiming it "autoruns EVERY session_start."


  The tests for this change use these names (create or adapt them as needed): abstract_claim, leak_blocked,
  verification_research.'
