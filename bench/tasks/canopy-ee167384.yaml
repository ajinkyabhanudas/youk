prompt: 'fix: drop superseded typo from history when a fuzzy suggestion is clicked


  Clicking a "did you mean X?" suggestion previously left the original

  mistyped question sitting in the history sidebar alongside the corrected

  one. Re-running that entry later hit the same 0-row result and forced the

  user through the same suggestion click again. _run_query_handler now

  accepts an optional superseded_question, captured from question_box at

  click-time and used to drop the dead-end entry from history instead of

  just deduping on exact string match. Live-verified in Docker against a

  real LLM: after clicking a suggestion, only the corrected question remains

  in history.


  The tests for this change use these names (create or adapt them as needed): superseded_question.'
