prompt: 'Add an opt-in independent-review requirement to gate_claim_done


  Research check against real published work (EDV, arxiv 2608.27311) names

  the Self-Confirmation Trap: an agent verifying its own work is still

  subject to the same blind spots that produced it. youk already has the

  right answer for research claims (externally_verified requires two

  independent passes agreeing, or a human statement) but nothing enforced

  the equivalent for code claims -- a session could self-verify within its

  own context and gate_claim_done would accept it.


  The tests for this change use these names (create or adapt them as needed): no_independent_review, require_independent_review.'
test_cmd: '{python} -m pytest {tests} -q -p no:cacheprovider --no-cov'
