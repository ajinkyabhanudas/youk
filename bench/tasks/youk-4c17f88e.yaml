prompt: 'Add lightweight pattern-library retrieval to claim decomposition (CIR-160)


  generate_sub_claims now optionally checks the real pattern library

  (state/verification-pattern-library.jsonl) for structurally similar past

  claim shapes that previously missed a sub_claim, via a new

  retrieve_similar_patterns helper, and surfaces the match as a pattern_hint

  on the matching sub_claim. Plain stdlib difflib.SequenceMatcher similarity

  over claim_shape strings -- no embeddings or vector DB, since the real

  corpus is a handful of rows and anything heavier would sit unexercised.

  Both new parameters default to None so every existing caller is unaffected.


  The tests for this change use these names (create or adapt them as needed): SequenceMatcher, claim_statement,
  pattern_hint, retrieve_similar_patterns.'
