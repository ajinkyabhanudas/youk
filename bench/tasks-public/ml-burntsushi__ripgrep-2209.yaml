  \ found or specified requirements.in files (compile).\r\n# Use -h to include hashes,\
  \ -u dep1,dep2... to upgrade specific dependencies, and -U to upgrade all.\r\npipc\
  \ () {  # [-h] [-U|-u <pkgspec>[,<pkgspec>...]] [<reqs-in>...] [-- <pip-compile-arg>...]\r\
