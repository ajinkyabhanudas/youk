version: "1.0"
updated: "2026-06-28"

# Optional field on any rule below: `role_scope: [actor, ...]` (e.g. [member]).
# Absent (the default on every rule here today) means the rule applies to everyone,
# unchanged from prior behaviour. When present, evaluate with
# guardrails.rule_applies_to_actor(rule, actor) rather than checking role_scope
# directly — it default-denies (treats the rule as applying) when actor is unknown.
# No rule currently declares this; it is a mechanism, not yet a policy.

hard_rules:
  - id: no-auto-apply-proposals
    name: "Self-heal proposals require founder approval"
    description: >
      youk cannot apply changes to skills, guardrails, or routes without
      explicit founder approval. apply_proposal tool enforces this.
    enforced_by: "youk-core.apply_proposal"
    violation: "BLOCK — return error, do not write"

  - id: no-credential-commits
    name: "No secrets in git"
    description: >
      Files matching *.env, *secret*, *credential*, *api_key*, *password*
      cannot be committed or written to knowledge/.
    enforced_by: "youk-code.check_commit_quality"
    violation: "BLOCK — name the specific file match"

  - id: knowledge-extraction-not-logging
    name: "Extract insights, never log transcripts"
    description: >
      knowledge/ stores structured insights (interpretation patterns, domain
      concepts, clarification cases, proposals). Raw session content is never
      written. session_end validates structure before any write.
    enforced_by: "youk-core.session_end — validate before write"
    violation: "BLOCK — refuse unstructured writes to knowledge/"

  - id: no-destructive-without-confirm
    name: "Destructive ops require explicit confirmation"
    description: >
      rm -rf, DROP TABLE, force push, reset --hard, git commit --no-verify:
      must confirm intent before executing. Confirmation is per-operation, not per-session.
      --no-verify is treated as destructive because it bypasses contract enforcement
      (pre-commit hook). The bypass must be auditable.
    enforced_by: "CLAUDE.md proactive pattern + check_command() MCP tool + pre-bash hook"
    violation: "BLOCK — surface confirmation prompt"

  - id: lint-before-commit
    name: "Run lint and tests before every commit"
    description: >
      ruff check servers/ and python -m pytest tests/ must pass before any commit.
      Enforced by .git/hooks/pre-commit (auto-generated from contracts.md action-type rules
      via scripts/generate_precommit_hook.py). Bypassing via --no-verify is itself
      blocked by check_command() as a destructive operation.
    enforced_by: ".git/hooks/pre-commit + check_command() blocks --no-verify"
    violation: "BLOCK — pre-commit exits 1, commit does not proceed"

soft_rules:
  - id: session-close-cluster
    name: "Session-close cluster at session end"
    description: "context-sync end + learn + humanize should run at session end"
    enforced_by: "youk-core.session_end"
    violation: "NUDGE — once, with explicit skip path"

  - id: nfr-before-m-tasks
    name: "NFR check before M+ tasks"
    description: "Medium and larger tasks should have NFR check before coding"
    enforced_by: "youk-core.route_task — warning flag in output"
    violation: "SURFACE — include in routing decision"

  - id: spec-before-l-tasks
    name: "write-spec before L/XL tasks"
    description: "Large tasks should have a write-spec output before dev-loop"
    enforced_by: "youk-core.route_task — warning flag in output"
    violation: "SURFACE — include in routing decision"

  - id: adr-for-real-alternatives
    name: "Document architectural choices with rejected alternatives"
    description: "When a decision has real alternatives, document it with /adr"
    enforced_by: "CLAUDE.md proactive pattern"
    violation: "SURFACE — once per session"

# Mechanical contracts compiled into code (S12). Source of truth is servers/shared/contract_guard.py
# (RULES); tests/test_contract_guard.py fails if this list and the code disagree. Enforced at
# PreToolUse for Bash commands, ungated in the `bare` arm, switched off per rule with
# YOUK_GUARD_OFF. Each block is recorded as a gate event named contract.<id>.
compiled_contracts:
  - id: commit-on-default-branch
    from: "work on a branch, not the default branch; one concept per commit"
  - id: push-to-default-branch
    from: "never push or commit directly to main; open a PR from a feature branch"
  - id: force-push
    from: "destructive operations need explicit confirmation (force push)"
  - id: no-verify
    from: "git commit --no-verify bypasses contract enforcement"
  - id: staged-screenshot
    from: "screenshot files from Playwright testing must never be committed"
  - id: staged-secret
    from: "make sure api keys are not committed to the repo"
  - id: read-dotenv
    from: "never read .env or any secrets file directly (Bash only; deny the Read tool in settings with Read(**/.env*))"
  - id: dependency-force
    from: "never use --legacy-peer-deps or --force to resolve a dependency conflict"
  - id: pr-structure
    from: "a PR description is a formal document: what changed, why, impact, how it was checked"
  - id: voice-pr-text
    from: "no AI-tells in any written output; PR titles and bodies are checked with the commit voice gate"

# Mechanical contracts deliberately not compiled here, with the reason.
not_compiled_contracts:
  - contract: "run lint and tests before every commit"
    reason: "already enforced by the generated .git/hooks/pre-commit (scripts/generate_precommit_hook.py); a second check would run lint twice"
  - contract: "never print, log or surface the value of API keys"
    reason: "decided by output content, not by the command; needs a redaction layer, not a command guard"
